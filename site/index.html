<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Les projets de Mouad El kbabty : web, Java, data, mobile et jeux.">
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Mouad El kbabty · Projets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230a84ff'/%3E%3Cstop offset='1' stop-color='%23bf5af2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <nav class="bar">
    <div class="bar-inner">
      <span class="bar-title" id="bar-name">Mouad El kbabty</span>
      <div class="bar-end">
        <div class="lang-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr" aria-pressed="true">FR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="pill-link" id="profile" href="https://github.com/mouadelkbabty">GitHub ↗</a>
      </div>
    </div>
  </nav>

  <main>
    <header class="hero">
      <div class="glow" aria-hidden="true"></div>
      <img class="avatar" id="avatar" alt="" width="104" height="104" hidden>
      <p class="eyebrow" data-i18n="eyebrow">Développeur · Java, web &amp; mobile</p>
      <h1 id="name">Mouad El kbabty</h1>
      <p class="lead" data-i18n="lead">Ce que je construis, du back-end Spring aux apps iPhone et Android TV.</p>
      <dl class="stats" id="stats" hidden>
        <div><dt data-i18n="statProjects">Projets</dt><dd id="stat-projects"></dd></div>
        <div><dt data-i18n="statLanguages">Langages</dt><dd id="stat-tech"></dd></div>
        <div><dt data-i18n="statSince">Depuis</dt><dd id="stat-since"></dd></div>
      </dl>
    </header>

    <section class="block" id="skills-block" hidden>
      <h2 class="section-title" data-i18n="skills">Compétences</h2>
      <div class="skills-main" id="skills-main"></div>
      <h3 class="sub-title" data-i18n="skillsMore">Et aussi</h3>
      <div class="skills-more" id="skills-more"></div>
    </section>

    <section class="block" id="featured-block" hidden>
      <h2 class="section-title" data-i18n="featured">À la une</h2>
      <div class="featured" id="featured"></div>
    </section>

    <section class="block" id="all-block">
      <div class="section-head">
        <h2 class="section-title" data-i18n="all">Tous les projets</h2>
        <div class="filters" id="filters" role="tablist"></div>
      </div>
      <div class="grid" id="grid" aria-live="polite">
        <p class="empty" id="empty"></p>
      </div>
    </section>
  </main>

  <footer class="foot" data-i18n="footer">Mis à jour automatiquement depuis GitHub chaque jour.</footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel" id="sheet-panel">
      <div class="grabber" aria-hidden="true"></div>
      <button class="close" id="sheet-close" type="button">✕</button>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </dialog>

  <script src="app.js?v=4"></script>
</body>
</html>
